description: >-
  Results of probing the /.well-known/ discovery surface for every Becton Dickinson host
  this record knows. BD publishes no API baseURL and no OpenAPI servers[] host, so the
  probe set is the registrable domain (bd.com), www.bd.com (the product + docs host),
  cybersecurity.bd.com (the Cybersecurity Trust Center vanity host, which 302s to
  www.bd.com/en-us/about-bd/cybersecurity), academy.bd.com (BD Learning Academy) and
  news.bd.com (the BD newsroom). NO /.well-known/ document was served on any host:
  www.bd.com and academy.bd.com answer 404 (HTML error page) for security.txt, and the
  Akamai edge answers 403 Access Denied for the dot-suffixed /.well-known/*.json paths
  regardless of user agent. The 404s on /.well-known/api-catalog and
  /.well-known/agent-card.json were re-confirmed through a browser-class fetch that the
  edge does serve, so those two are recorded as genuine 404s rather than edge denials.
  NO WellKnown or SecurityTxt pointer is emitted from this file — it records an absence.
  NOTE the same edge serves https://www.bd.com/llms.txt (200, text/plain) to a browser
  user agent while returning 403 Access Denied to ClaudeBot/1.0 and GPTBot/1.0 for that
  same path; see llms/becton-dickinson-llms.txt.
